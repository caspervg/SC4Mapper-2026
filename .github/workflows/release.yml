name: Release

on:
  push:
    tags:
      - "v*.*"

permissions:
  contents: write

jobs:
  validate-tag:
    name: Validate Release Tag
    runs-on: ubuntu-latest

    steps:
      - name: Validate version tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]{4}\.[0-9]+[a-z]$ ]]; then
            echo "Release tags must match vYYYY.Nsuffix, for example v2026.1a. Got: $TAG_NAME"
            exit 1
          fi

  package:
    name: Package ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    needs: validate-tag
    continue-on-error: ${{ matrix.platform.experimental }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            os: windows-latest
            archive: SC4Mapper-windows-x64.zip
            experimental: false
          - name: macOS
            os: macos-latest
            archive: SC4Mapper-macos-arm64.zip
            experimental: true
          - name: Linux
            os: ubuntu-latest
            archive: SC4Mapper-linux-x64.tar.gz
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        if: runner.os != 'Linux'
        run: uv python install 3.12

      - name: Install Linux wxPython
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-wxgtk4.0
          uv venv --python "$(command -v python3)" --system-site-packages
          uv run --no-sync python -c "import wx; print('wxPython', wx.version())"

      - name: Sync dev environment (tests)
        if: runner.os == 'Windows'
        run: uv sync --python 3.12 --group dev

      - name: Run tests
        if: runner.os == 'Windows'
        run: uv run --python 3.12 pytest

      - name: Set release version
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          version = os.environ["TAG_NAME"].removeprefix("v")
          path = pathlib.Path("src/sc4mapper/version.py")
          path.write_text(
              re.sub(r'VERSION = "[^"]+"', f'VERSION = "{version}"', path.read_text(encoding="utf-8")),
              encoding="utf-8",
          )
          PY

      - name: Sync build environment
        if: runner.os != 'Linux'
        run: uv sync --python 3.12 --group build

      - name: Sync build environment (Linux)
        if: runner.os == 'Linux'
        run: uv sync --group build --no-install-package wxpython

      - name: Build executable
        if: runner.os != 'Linux'
        run: uv run --python 3.12 pyinstaller --clean --noconfirm SC4Mapper.spec

      - name: Build executable (Linux)
        if: runner.os == 'Linux'
        run: uv run pyinstaller --clean --noconfirm SC4Mapper.spec

      - name: Add user config
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item -Recurse -Force config dist/SC4Mapper/config

      - name: Add user config
        if: runner.os != 'Windows' && runner.os != 'macOS'
        run: cp -R config dist/SC4Mapper/config

      - name: Add user config (macOS bundle)
        if: runner.os == 'macOS'
        run: cp -R config dist/SC4Mapper.app/Contents/MacOS/config

      - name: Ad-hoc sign macOS bundle
        if: runner.os == 'macOS'
        run: codesign --deep --force --sign - dist/SC4Mapper.app

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/SC4Mapper -DestinationPath "${{ matrix.platform.archive }}"

      - name: Create macOS archive
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/SC4Mapper.app "${{ matrix.platform.archive }}"

      - name: Create Linux archive
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.platform.archive }}" -C dist SC4Mapper

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform.archive }}
          path: ${{ matrix.platform.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: package

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: SC4Mapper-*
          path: release-artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cat > release-notes.md << 'EOF'
          ## macOS

          After unzipping, remove the quarantine flag before launching:

          ```sh
          xattr -rd com.apple.quarantine SC4Mapper.app
          ```

          This is required once because the app is distributed without an Apple Developer certificate.
          EOF
          gh release create "$TAG_NAME" release-artifacts/* \
            --repo "${{ github.repository }}" \
            --title "$TAG_NAME" \
            --notes-file release-notes.md
